services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forensics
      POSTGRES_USER: forensics
      POSTGRES_PASSWORD: forensics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensics -d forensics"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/forensics

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://forensics:forensics@postgres:5432/forensics
      QUEUE_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      LOCAL_STORAGE_ROOT: /data/storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: forensics
      WATERMARK_PROVIDER: ${WATERMARK_PROVIDER:-off}
      WATERMARK_ENDPOINT: ${WATERMARK_ENDPOINT:-}
      WATERMARK_API_KEY: ${WATERMARK_API_KEY:-}
      WATERMARK_APP_ID: ${WATERMARK_APP_ID:-}
      WATERMARK_SECRET: ${WATERMARK_SECRET:-}
      WATERMARK_ALLOW_MEDIA_UPLOAD: ${WATERMARK_ALLOW_MEDIA_UPLOAD:-false}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - derived-cache:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    command:
      - celery
      - -A
      - apps.api.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://forensics:forensics@postgres:5432/forensics
      QUEUE_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      LOCAL_STORAGE_ROOT: /data/storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: forensics
      WATERMARK_PROVIDER: ${WATERMARK_PROVIDER:-off}
      WATERMARK_ENDPOINT: ${WATERMARK_ENDPOINT:-}
      WATERMARK_API_KEY: ${WATERMARK_API_KEY:-}
      WATERMARK_APP_ID: ${WATERMARK_APP_ID:-}
      WATERMARK_SECRET: ${WATERMARK_SECRET:-}
      WATERMARK_ALLOW_MEDIA_UPLOAD: ${WATERMARK_ALLOW_MEDIA_UPLOAD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - derived-cache:/data/storage

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
      PUBLIC_ACCESS_USER: ${PUBLIC_ACCESS_USER:-dhfp}
      PUBLIC_ACCESS_PASSWORD: ${PUBLIC_ACCESS_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  minio-data:
  derived-cache:
