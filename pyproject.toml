[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-human-forensics"
version = "0.1.0"
description = "证据优先的数字人 / 生成合成内容鉴别平台"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Digital Human Forensics Team" }]
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "boto3>=1.35.0",
  "celery>=5.4.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.4",
  "matplotlib>=3.9.0",
  "numpy>=2.1.0",
  "opencv-python-headless>=4.10.0,<5",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "redis>=5.2.0",
  "scikit-learn>=1.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.21.0"]
export = [
  "onnx>=1.17.0",
  "onnxscript>=0.3.0",
  "torch>=2.5.0",
  "transformers>=4.48.0",
]
dev = [
  "jsonschema>=4.23.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
dhfp = "dhfp.evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dhfp", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
